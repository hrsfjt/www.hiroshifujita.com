name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Create production config
        run: |
          cat > config.prod.toml << 'EOF'
          baseURL = "https://hiroshifujita.com/"
          languageCode = "ja-jp"
          defaultcontentlanguage = "ja"
          hasCJKLanguage = true
          title = "HIROSHI FUJITA"
          paginate = 5
          theme = "simple-and-fast"
          categories = ["blog", "page"]
          uglyurls = true

          [author]
            name = "hiroshifujita"
            mail = "fuchantoshu@gmail.com"

          [social]
            facebook = "fujita.hiroshi.82"
            twitter = "shiropiritamma"
            github = "hrsfjt"

          [params]
            title = "HIROSHI FUJITA"
            description = "hiroshifujitaの活動や日々の記録をつづるブログ"
            images = ["https://hiroshifujita.com/img/hiroshifujita.jpg"]
            locale = "ja_JP"
            googleAnalytics = "${{ secrets.GOOGLE_ANALYTICS_ID }}"

          [taxonomies]
            category = "categories"

          [related]
            threshold = 80
            includeNewer = true
            toLower = true
            [[related.indices]]
              name = "categories"
              weight = 60
            [[related.indices]]
              name = "keywords"
              weight = 20
            [[related.indices]]
              name = "date"
              weight = 10
          EOF

      - name: Build
        run: |
          rm -rf public resources
          hugo --config config.prod.toml --minify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 rm s3://${{ secrets.BUCKET_NAME }}/ --recursive
          aws s3 sync public/ s3://${{ secrets.BUCKET_NAME }}/

      - name: Invalidate CloudFront cache
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
