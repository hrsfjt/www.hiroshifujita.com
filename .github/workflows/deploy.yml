name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build site
        run: hugo --minify

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Create production config
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          GOOGLE_ANALYTICS: ${{ secrets.GOOGLE_ANALYTICS }}
          ADSENSE: ${{ secrets.ADSENSE }}
          OG_IMAGE: ${{ secrets.OG_IMAGE }}
        run: |
          cat > config.prod.toml <<EOF
          baseURL = "${BASE_URL}"
          languageCode = "ja-jp"
          defaultcontentlanguage = "ja"
          hasCJKLanguage = true
          title = "HIROSHI FUJITA"
          paginate = 5
          theme = "simple-and-fast"
          categories = ["blog", "page"]
          uglyurls = true

          [author]
            name = "hiroshifujita"
            mail = "fuchantoshu@gmail.com"

          [social]
            facebook = "fujita.hiroshi.82"
            twitter = "shiropiritamma"
            github = "hrsfjt"

          [params]
            title = "HIROSHI FUJITA"
            description = "hiroshifujitaの活動や日々の記録をつづるブログ"
            images = ["${OG_IMAGE}"]
            locale = "ja_JP"
            adsense = "${ADSENSE}"
            googleAnalytics = "${GOOGLE_ANALYTICS}"

          [taxonomies]
            category = "categories"

          [related]
            threshold = 80
            includeNewer = true
            toLower = true
            [[related.indices]]
              name = "categories"
              weight = 60
            [[related.indices]]
              name = "keywords"
              weight = 20
            [[related.indices]]
              name = "date"
              weight = 10
          EOF

      - name: Build site for production
        run: hugo --config config.prod.toml --minify

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: |
          aws s3 rm "s3://${BUCKET_NAME}/" --recursive
          aws s3 sync public/ "s3://${BUCKET_NAME}/"

      - name: Invalidate CloudFront cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
