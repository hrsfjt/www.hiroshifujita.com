name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.2"
          extended: true

      - name: Build site
        run: hugo --minify

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.2"
          extended: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Create production config
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          GOOGLE_ANALYTICS: ${{ secrets.GOOGLE_ANALYTICS }}
          ADSENSE: ${{ secrets.ADSENSE }}
          OG_IMAGE: ${{ secrets.OG_IMAGE }}
        run: |
          cat > config.prod.toml <<EOF
          baseURL = "${BASE_URL}"

          [params]
            images = ["${OG_IMAGE}"]
            adsense = "${ADSENSE}"
            googleAnalytics = "${GOOGLE_ANALYTICS}"
          EOF

      - name: Build site for production
        run: hugo --config config.toml,config.prod.toml --minify

      - name: Deploy to S3
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${BUCKET_NAME:-}" ]; then
            echo "Error: BUCKET_NAME is not set or empty."
            exit 1
          fi

          aws s3 sync public/ "s3://${BUCKET_NAME}/" --delete --exact-timestamps

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        if: env.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
